# Physical joint calibration measurements for the NXP RS robot.
#
# Encoder stop values are motor-side positions in radians. The URDF limits
# below are derived in joint coordinates after applying each motor direction
# in robstride.yaml and subtracting the measured zero.
# The measured stops are intentionally preserved exactly; add an inward safety
# margin before enabling torque if the mechanism needs clearance from its hard
# stops.
#
# The repository uses hyphenated ROS joint names (joint-1, ...), not the
# underscore names used in the handwritten measurement notes.

schema_version: 1

measurement_units:
  encoder_position: rad
  revolute_joint_position: rad
  prismatic_joint_position: m

joints:
  joint-1:
    id: 1
    encoder:
      zero_position_rad: 3.142
      lower_stop_rad: 0.0
      upper_stop_rad: 6.38
    urdf:
      type: revolute
      lower_rad: -3.14
      upper_rad: 3.14

  joint-2:
    id: 2
    encoder:
      zero_position_rad: 4.937
      lower_stop_rad: 3.06
      upper_stop_rad: 6.8
    urdf:
      type: revolute
      lower_rad: -1.863
      upper_rad: 1.877

  joint-3:
    id: 3
    encoder:
      zero_position_rad: 5.835
      lower_stop_rad: 2.82
      upper_stop_rad: 9.05
    urdf:
      type: revolute
      lower_rad: -3.215
      upper_rad: 3.015

  joint-4:
    id: 4
    encoder:
      zero_position_rad: 0.0
      lower_stop_rad: -2.28
      upper_stop_rad: 2.086
    urdf:
      type: revolute
      lower_rad: -2.28
      upper_rad: 2.086

  joint-5:
    id: 5
    encoder:
      zero_position_rad: -1.051
      lower_stop_rad: -2.89
      upper_stop_rad: 1.038
    urdf:
      type: revolute
      lower_rad: -1.839
      upper_rad: 2.089

  joint-6:
    id: 6
    # The physical reference pose previously reported ROS q=0.767354 rad
    # with encoder zero 0.929 rad. Rebase that pose to ROS/RViz zero.
    encoder:
      zero_position_rad: 0.161645692
      lower_stop_rad: -2.22
      upper_stop_rad: 4.169
    urdf:
      type: revolute
      lower_rad: -4.007354308
      upper_rad: 2.381645692

  # Motor 7 is rotational at the encoder, while the robot model exposes the
  # driven right finger as a prismatic joint. Its prismatic coordinate is
  # anchored at the physical open endpoint so ROS/RViz reports that pose as
  # zero. The measured open-position sample was -0.043456 m in the previous
  # ROS frame and maps to raw 2.025844 rad. Raw -0.04 rad remains the closed
  # endpoint; with the existing scale this gives 0.083756 m of travel.
  # Confirm both endpoints on the physical mechanism after restarting bringup.
  joint_right-finger:
    id: 7
    encoder_type: revolute
    urdf_type: prismatic
    encoder:
      zero_position_rad: 2.02584429
      open_stop_rad: 2.02584429
      close_stop_rad: -0.04
    encoder_joint_limits:
      lower_rad: -2.06584429
      upper_rad: 0.0
    physical:
      open_position_m: 0.0
      close_position_m: 0.0837560613
    urdf:
      type: prismatic
      lower_m: 0.0
      upper_m: 0.0837560613
      position_scale_m_per_encoder_rad: 0.040543259557

  joint_left-finger:
    type: mimic
    mimic:
      joint: joint_right-finger
      multiplier: -1.0
    urdf:
      type: prismatic
      lower_m: -0.0837560613
      upper_m: 0.0
