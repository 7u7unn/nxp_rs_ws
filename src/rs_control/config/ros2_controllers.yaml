controller_manager:
  ros__parameters:
    # Keep the trajectory/reference loop aligned with the hardware I/O loop.
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - joint-1
      - joint-2
      - joint-3
      - joint-4
      - joint-5
      - joint-6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    # Preserve the last commanded state when the jogger replaces a trajectory.
    # This prevents a loaded joint's holding position error from being reset to
    # measured feedback at every key press.
    open_loop_control: true
    # Match the reference hardware controller and allow a smooth hand-off when
    # a new plan starts with the arm still settling.
    allow_nonzero_velocity_at_trajectory_start: true
    interpolation_method: splines

gripper_controller:
  ros__parameters:
    joints:
      - joint_right-finger
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: true
    interpolation_method: splines
