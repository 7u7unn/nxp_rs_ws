# MoveIt maps planning groups to trajectory actions in both launch modes.
# Keep execution timing at MoveIt's defaults, as in the reference package.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - gripper_controller

  arm_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - joint-1
      - joint-2
      - joint-3
      - joint-4
      - joint-5
      - joint-6

  gripper_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: false
    joints:
      - joint_right-finger
